<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import Pipeline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230f1117'/%3E%3Ctext x='50' y='72' font-family='Georgia' font-size='62' font-style='italic' fill='%23c0c0d8' text-anchor='middle' letter-spacing='-2'%3ESN%3C/text%3E%3C/svg%3E" type="image/svg+xml">
<style>
* { box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1115;
    color: #e6e8eb;
    margin: 0;
    padding: 24px 20px 60px;
}
h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
.sub { color: #8a909c; font-size: 12px; margin-bottom: 16px; }
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
    max-width: 1100px;
}
.card {
    background: #171a21;
    border: 1px solid #262b35;
    border-radius: 10px;
    padding: 10px 12px;
}
.card .num {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}
.card .label {
    color: #8a909c;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
}
.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}
.tab {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #262b35;
    background: #171a21;
    color: #8a909c;
    cursor: pointer;
    font-size: 12px;
}
.tab.active {
    color: #e6e8eb;
    border-color: #5b9dff;
}
.wrap {
    overflow-x: auto;
    border: 1px solid #262b35;
    border-radius: 10px;
    background: #171a21;
    max-width: 100%;
}
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
}
thead th {
    text-align: left;
    color: #8a909c;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 6px 10px;
    border-bottom: 1px solid #262b35;
    position: sticky;
    top: 0;
    background: #0f1115;
}
tbody td {
    padding: 6px 10px;
    border-bottom: 1px solid #262b35;
    vertical-align: top;
}
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.key { font-variant-numeric: tabular-nums; white-space: nowrap; color: #8a909c; }
td.title { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage {
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: .03em;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
}
.stage-transforming, .stage-applying, .stage-triaging { color: #f5c45e; }
.stage-applied { color: #3ddc84; }
.stage-queued, .stage-downloaded, .stage-candidate { color: #8a909c; }
.stage-blocked, .stage-error, .stage-declined { color: #ff5c5c; }
.btn {
    background: #262b35;
    border: 1px solid #262b35;
    color: #e6e8eb;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
}
.btn:hover { background: #3a3f4b; }
.btn.primary {
    background: #5b9dff;
    border-color: #5b9dff;
}
.btn.primary:hover { background: #6faaff; }
.muted { color: #8a909c; }
.filterbar { display: flex; gap: 6px; align-items: center; margin: 0 0 8px; }
.filterbar .muted { margin-left: 8px; font-size: 12px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.stage-hold, .stage-assessed, .stage-ready, .stage-genus-authority { color: #f5c45e; }
.stage-refused, .stage-skipped { color: #8a909c; }
.stage-added { color: #5b9dff; }

.refresh-btn {
    background: #171a21;
    border: 1px solid #262b35;
    color: #e6e8eb;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
}
.refresh-btn:hover { background: #262b35; }
.spinner {
    width: 16px;
    height: 16px;
    border: 2px solid #262b35;
    border-top-color: #5b9dff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    display: inline-block;
    margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.wrap.grid { max-height: calc(100vh - 250px); overflow: auto; }
.grid thead th { z-index: 1; vertical-align: bottom; }
.grid thead tr.filters th { top: 27px; padding: 0 6px 6px; text-transform: none; }
.grid th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
.grid th.sortable:hover { color: #e6e8eb; }
.grid th .arrow { color: #5b9dff; margin-left: 3px; }
.grid .filters input, .grid .filters select {
    width: 100%;
    min-width: 48px;
    background: #171a21;
    border: 1px solid #262b35;
    border-radius: 4px;
    color: #e6e8eb;
    font-size: 11px;
    padding: 3px 5px;
}
.grid .filters input:focus, .grid .filters select:focus { outline: none; border-color: #5b9dff; }
.grid .filters input.active, .grid .filters select.active { border-color: #5b9dff; }
.stage-failed { color: #ff5c5c; }
.empty {
    text-align: center;
    padding: 40px;
    color: #8a909c;
}
</style>
</head>
<body>
<h1>Import Pipeline</h1>
<div class="sub" id="asof">loading&hellip;</div>

<div class="tabs">
    <button class="tab active" id="tab-pipeline" onclick="loadQueue()">Pipeline</button>
    <button class="tab" id="tab-stuck" onclick="loadStuck()">Stuck</button>
    <button class="tab" id="tab-gbif" onclick="loadGbifDatasets()">GBIF Datasets</button>
</div>

<div class="cards" id="resCards"></div>

<div id="pipelineView">
    <div class="filterbar">
        <button class="btn" onclick="pipeGrid.clear()">Clear sort &amp; filters</button>
        <span class="muted" id="pipelineCount"></span>
        <span class="muted">Number filters: <code>&gt;1000</code>, <code>&lt;=0</code>, <code>10..500</code>, <code>2k</code>; age takes <code>m</code>/<code>h</code>/<code>d</code>, e.g. <code>&gt;6h</code>.</span>
    </div>
    <div class="wrap grid" id="pipelineWrap">
        <table>
            <thead id="pipelineHead"></thead>
            <tbody id="pipelineRows"></tbody>
        </table>
    </div>
</div>

<div id="gbifWrap" style="display:none;">
    <div class="filterbar">
        <button class="tab" id="gf-undecided" onclick="setGbifFilter('undecided')">Undecided</button>
        <button class="tab" id="gf-decided" onclick="setGbifFilter('decided')">Decided</button>
        <button class="tab" id="gf-all" onclick="setGbifFilter('all')">All</button>
        <span class="muted" id="gbifMsg"></span>
    </div>
    <div class="wrap">
    <table>
        <thead>
            <tr>
                <th>Key</th>
                <th>Title</th>
                <th>Status</th>
                <th class="num">Last event</th>
                <th class="num">Age</th>
                <th class="num">Name usages</th>
                <th>Licence</th>
                <th>Country</th>
                <th>Match</th>
                <th class="num">Decision</th>
            </tr>
        </thead>
        <tbody id="gbifRows"></tbody>
    </table>
    </div>
</div>

<script>
let rows = [];
let gbifRows = [];
let currentTab = 'pipeline';
let refreshTimer = null;

function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/[&<>"']/g, function(m) {
        return ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m]);
    });
}

function shortKey(key) {
    return key.replace(/^checklistbank-/, '');
}

function updateTabs(key) {
    currentTab = key;
    document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
    const activeTab = document.getElementById('tab-' + key);
    if (activeTab) activeTab.classList.add('active');
}

async function loadQueue() {
    currentTab = 'pipeline';
    updateTabs('pipeline');
    try {
        const resp = await fetch('/queue');
        rows = await resp.json();
        renderCards(rows);
        renderTable(rows);
        document.getElementById('asof').textContent = 'Updated ' + new Date().toLocaleTimeString();
        document.getElementById('gbifWrap').style.display = 'none';
        document.getElementById('pipelineView').style.display = 'block';
    } catch (e) {
        console.error('Failed to load queue:', e);
    }
}


async function loadStuck() {
    currentTab = 'stuck';
    updateTabs('stuck');
    document.getElementById('pipelineView').style.display = 'none';
    document.getElementById('gbifWrap').style.display = 'none';
    document.getElementById('pipelineRows').innerHTML = '<tr><td colspan="11" class="empty">Stuck sources view coming soon</td></tr>';
    document.getElementById('resCards').innerHTML = '';
    document.getElementById('asof').textContent = 'Stuck view';
}


function renderCards(rows) {
    const counts = {};
    for (const r of rows) {
        counts[r.stage] = (counts[r.stage] || 0) + 1;
    }
    const total = rows.length;
    const added = rows.reduce((sum, r) => sum + (r.added || 0), 0);
    const merged = rows.reduce((sum, r) => sum + (r.merged || 0), 0);

    const cards = [
        { label: 'Total', num: total },
        { label: 'Applied', num: counts.applied || 0, color: '#3ddc84' },
        { label: 'Transforming', num: counts.transforming || 0, color: '#f5c45e' },
        { label: 'Applying', num: counts.applying || 0, color: '#f5c45e' },
        { label: 'Queued', num: counts.queued || 0, color: '#8a909c' },
        { label: 'Downloaded', num: rows.filter(r => r.stage === 'downloaded' && !lastStepFailed(r)).length, color: '#8a909c' },
        { label: 'Failed, will retry', num: rows.filter(lastStepFailed).length, color: '#ff5c5c' },
        { label: 'Blocked', num: counts.blocked || 0, color: '#ff5c5c' },
        { label: 'Error', num: counts.error || 0, color: '#ff5c5c' },
        { label: 'Added', num: added, color: '#3ddc84' },
        { label: 'Merged', num: merged, color: '#3ddc84' },
    ];

    let html = '';
    for (const c of cards) {
        html += '<div class="card"><div class="num" style="color:' + c.color + '">' + fmtNum(c.num) + '</div><div class="label">' + c.label + '</div></div>';
    }
    document.getElementById('resCards').innerHTML = html;
}

// Numbers: thousands separators; absent values as an en dash.
function fmtNum(v) {
    return (v === undefined || v === null) ? '–' : Number(v).toLocaleString('en-US');
}

// Timestamps arrive as RFC3339 UTC (normalised server-side); show them in
// local time, fixed width, so the column lines up.
function fmtTime(iso) {
    if (!iso) return '–';
    const d = new Date(iso);
    if (isNaN(d)) return escapeHtml(iso);
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// Age since the last stage change, in the largest sensible unit.
function fmtAge(iso) {
    if (!iso) return '–';
    const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (isNaN(mins) || mins < 0) return '–';
    if (mins < 60) return mins + 'm';
    if (mins < 48 * 60) return Math.floor(mins / 60) + 'h';
    return Math.floor(mins / 1440) + 'd';
}

// A failed transform leaves the row at `downloaded` so the next pass retries
// it; the reason is what tells it apart from one simply waiting its turn.
function lastStepFailed(r) {
    return r.stage === 'downloaded' && /\bfailed\b|timed out/.test(r.reason || '');
}

function displayStage(r) {
    return lastStepFailed(r) ? 'transform failed' : r.stage;
}

// Applied and declined are end states: nothing is waiting, so an age would
// only measure how long ago it finished, which Last event already shows.
// Error and blocked keep theirs -- they wait on a person.
const END_STAGES = new Set(['applied', 'declined']);

function ageMins(r) {
    if (!r.lastEventAt || END_STAGES.has(r.stage)) return null;
    const m = Math.floor((Date.now() - new Date(r.lastEventAt).getTime()) / 60000);
    return isNaN(m) || m < 0 ? null : m;
}

function fmtMins(mins) {
    if (mins === null || mins === undefined) return '';
    if (mins < 60) return mins + 'm';
    if (mins < 48 * 60) return Math.floor(mins / 60) + 'h';
    return Math.floor(mins / 1440) + 'd';
}

// ---- Grid: sortable headers, a filter per column, header rows that stay put.
// cols: {id, label, type: 'text'|'select'|'num'|'time', get(row), cell(row) -> html, cls}
// Number filters take >, >=, <, <=, = or a..b, with k (thousand) and m/h/d
// (minutes, for age) suffixes; anything else is a substring match.
function parseQty(t) {
    const m = /^(-?\d+(?:\.\d+)?)\s*([kmhd%]?)$/i.exec(t.trim());
    if (!m) return null;
    const mult = { k: 1000, m: 1, h: 60, d: 1440, '%': 1, '': 1 }[m[2].toLowerCase()];
    return parseFloat(m[1]) * mult;
}

function numMatcher(q) {
    const range = /^(.+?)\.\.(.+)$/.exec(q);
    if (range) {
        const a = parseQty(range[1]), b = parseQty(range[2]);
        if (a !== null && b !== null) return v => v !== null && v >= a && v <= b;
    }
    const op = /^(>=|<=|>|<|=)?\s*(.+)$/.exec(q);
    const n = op && parseQty(op[2]);
    if (n === null || n === undefined) return null;
    switch (op[1]) {
        case '>': return v => v !== null && v > n;
        case '>=': return v => v !== null && v >= n;
        case '<': return v => v !== null && v < n;
        case '<=': return v => v !== null && v <= n;
        default: return v => v !== null && v === n;
    }
}

function makeGrid(opts) {
    const g = { cols: opts.cols, rows: [], sort: null, dir: 1, filters: {} };
    const head = document.getElementById(opts.head);
    const body = document.getElementById(opts.body);
    const val = (c, r) => { const v = c.get(r); return v === undefined ? null : v; };

    head.innerHTML =
        '<tr>' + g.cols.map(c => '<th class="sortable' + (c.num ? ' num' : '') + '" data-col="' + c.id + '">' +
            c.label + '<span class="arrow"></span></th>').join('') + '</tr>' +
        '<tr class="filters">' + g.cols.map(c => '<th>' + (c.type === 'select'
            ? '<select data-col="' + c.id + '"><option value="">all</option></select>'
            : '<input data-col="' + c.id + '" placeholder="' + (c.num ? '>0' : 'filter') + '">') + '</th>').join('') + '</tr>';

    head.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
        const id = th.dataset.col;
        if (g.sort !== id) { g.sort = id; g.dir = 1; }
        else if (g.dir === 1) g.dir = -1;
        else g.sort = null;
        g.render();
    }));
    head.querySelectorAll('input, select').forEach(el => el.addEventListener('input', () => {
        g.filters[el.dataset.col] = el.value;
        el.classList.toggle('active', !!el.value);
        g.render();
    }));

    g.clear = () => {
        g.sort = null; g.filters = {};
        head.querySelectorAll('input, select').forEach(el => { el.value = ''; el.classList.remove('active'); });
        g.render();
    };

    g.setRows = rows => {
        g.rows = rows;
        // Refresh select options from the data, keeping the current choice.
        head.querySelectorAll('select').forEach(sel => {
            const c = g.cols.find(c => c.id === sel.dataset.col);
            const seen = [...new Set(rows.map(r => String(val(c, r) ?? '')))].filter(Boolean).sort();
            const cur = sel.value;
            sel.innerHTML = '<option value="">all</option>' +
                seen.map(v => '<option' + (v === cur ? ' selected' : '') + '>' + escapeHtml(v) + '</option>').join('');
        });
        g.render();
    };

    g.render = () => {
        let shown = g.rows;
        for (const c of g.cols) {
            const q = (g.filters[c.id] || '').trim();
            if (!q) continue;
            if (c.type === 'select') { shown = shown.filter(r => String(val(c, r) ?? '') === q); continue; }
            const m = c.num && numMatcher(q);
            if (m) { shown = shown.filter(r => m(val(c, r))); continue; }
            const needle = q.toLowerCase();
            const text = c.text || (r => String(val(c, r) ?? ''));
            shown = shown.filter(r => text(r).toLowerCase().includes(needle));
        }
        if (g.sort) {
            const c = g.cols.find(c => c.id === g.sort);
            shown = shown.slice().sort((a, b) => {
                const x = val(c, a), y = val(c, b);
                if (x === null || x === '') return (y === null || y === '') ? 0 : 1;   // blanks last, both ways
                if (y === null || y === '') return -1;
                return (typeof x === 'number' && typeof y === 'number' ? x - y
                    : String(x).localeCompare(String(y), undefined, { numeric: true })) * g.dir;
            });
        }
        head.querySelectorAll('th.sortable').forEach(th =>
            th.querySelector('.arrow').textContent = th.dataset.col === g.sort ? (g.dir === 1 ? '▲' : '▼') : '');
        body.innerHTML = shown.length
            ? shown.map(r => '<tr>' + g.cols.map(c => c.cell(r)).join('') + '</tr>').join('')
            : '<tr><td colspan="' + g.cols.length + '" class="empty">' +
              (g.rows.length ? 'No rows match the filters' : 'No sources in the queue') + '</td></tr>';
        if (opts.count) document.getElementById(opts.count).textContent =
            shown.length === g.rows.length ? fmtNum(g.rows.length) + ' rows' : fmtNum(shown.length) + ' of ' + fmtNum(g.rows.length) + ' rows';
    };
    return g;
}

const numCol = (id, label, get) => ({
    id, label, type: 'num', num: true, get,
    cell: r => '<td class="num">' + fmtNum(get(r)) + '</td>',
});

const pipeGrid = makeGrid({
    head: 'pipelineHead', body: 'pipelineRows', count: 'pipelineCount',
    cols: [
        { id: 'key', label: 'Key', type: 'text', get: r => shortKey(r.key),
          cell: r => '<td class="key">' + escapeHtml(shortKey(r.key)) + '</td>' },
        { id: 'title', label: 'Title', type: 'text', get: r => r.title || '',
          cell: r => '<td class="title" title="' + escapeHtml(r.title || '') + '">' + escapeHtml(r.title || '') + '</td>' },
        { id: 'stage', label: 'Stage', type: 'select', get: displayStage,
          cell: r => {
              const st = displayStage(r);
              const cls = lastStepFailed(r) ? 'failed' : r.stage;
              const tip = r.reason ? ' title="' + escapeHtml(r.reason) + '"' : '';
              return '<td><span class="stage stage-' + escapeHtml(cls) + '"' + tip + '>' + escapeHtml(st) + '</span></td>';
          } },
        { id: 'lastEventAt', label: 'Last event', type: 'time', num: false, get: r => r.lastEventAt || null,
          text: r => fmtTime(r.lastEventAt),
          cell: r => '<td class="num" title="' + escapeHtml(r.lastEventAt || '') + '">' + fmtTime(r.lastEventAt) + '</td>' },
        { id: 'age', label: 'Age', type: 'num', num: true, get: ageMins,
          cell: r => '<td class="num">' + fmtMins(ageMins(r)) + '</td>' },
        numCol('offered', 'Offered', r => r.offered),
        numCol('staged', 'Staged', r => r.staged),
        numCol('added', 'Added', r => r.added),
        numCol('merged', 'Merged', r => r.merged),
        numCol('refused', 'Refused', r => r.refused),
        { id: 'rate', label: 'Rate', type: 'num', num: true,
          get: r => r.refusalRate != null ? Math.round(r.refusalRate * 1000) / 10 : null,
          cell: r => '<td class="num">' + (r.refusalRate != null ? (r.refusalRate * 100).toFixed(1) + '%' : '–') + '</td>' },
    ],
});

function renderTable(rows) {
    pipeGrid.setRows(rows);
}


// ---- GBIF tab: every GBIF checklist dataset against the pipeline, so each
// one can be seen to carry a decision (pipeline stage, manifest verdict, or
// a skip/add made here).
let gbifFilter = 'undecided';

async function loadGbifDatasets() {
    updateTabs('gbif');
    try {
        const resp = await fetch('/gbif');
        gbifRows = await resp.json();
        renderGbifCards(gbifRows);
        renderGbifTable(gbifRows);
        document.getElementById('asof').textContent = 'Updated ' + new Date().toLocaleTimeString();
        document.getElementById('gbifWrap').style.display = 'block';
        document.getElementById('pipelineView').style.display = 'none';
    } catch (e) {
        console.error('Failed to load GBIF datasets:', e);
    }
}

function setGbifFilter(f) {
    gbifFilter = f;
    renderGbifTable(gbifRows);
}

function renderGbifCards(rows) {
    const n = pred => rows.filter(pred).length;
    const cards = [
        { label: 'GBIF sets', num: rows.length },
        { label: 'Decided', num: n(r => r.status !== 'undecided'), color: '#3ddc84' },
        { label: 'Undecided', num: n(r => r.status === 'undecided'), color: '#f5c45e' },
        { label: 'In pipeline', num: n(r => r.statusFrom === 'pipeline'), color: '#3ddc84' },
        { label: 'In manifest', num: n(r => r.statusFrom === 'manifest'), color: '#3ddc84' },
        { label: 'Skipped', num: n(r => r.status === 'skipped'), color: '#8a909c' },
    ];
    document.getElementById('resCards').innerHTML = cards.map(c =>
        '<div class="card"><div class="num" style="color:' + (c.color || '') + '">' + fmtNum(c.num) +
        '</div><div class="label">' + c.label + '</div></div>').join('');
}

function gbifAction(r) {
    if (r.statusFrom === 'pipeline' || r.statusFrom === 'manifest') {
        return '<span class="muted">' + escapeHtml(r.pipelineKey || '') + '</span>';
    }
    if (r.statusFrom === 'decision') {
        return '<button class="btn" onclick="gbifDecide(\'' + escapeHtml(r.key) + '\', \'clear\')">Undo</button>';
    }
    const nc = /\bnc\b/.test((r.licence || '').replace(/[\s-]+/g, ' '));
    const why = !r.clbKey ? 'no ChecklistBank copy to download' : nc ? 'NC licence -- the pipeline would block it' : '';
    return '<button class="btn primary"' + (why ? ' disabled title="' + escapeHtml(why) + '"' : '') +
        ' onclick="gbifDecide(\'' + escapeHtml(r.key) + '\', \'add\')">Add</button> ' +
        '<button class="btn" onclick="gbifDecide(\'' + escapeHtml(r.key) + '\', \'skip\')">Skip</button>';
}

function renderGbifTable(rows) {
    ['undecided', 'decided', 'all'].forEach(f =>
        document.getElementById('gf-' + f).classList.toggle('active', f === gbifFilter));
    const shown = rows.filter(r => gbifFilter === 'all' ||
        (gbifFilter === 'undecided') === (r.status === 'undecided'));
    const tbody = document.getElementById('gbifRows');
    if (!shown.length) {
        tbody.innerHTML = '<tr><td colspan="10" class="empty">Nothing here</td></tr>';
        return;
    }
    tbody.innerHTML = shown.map(r => {
        const key = r.clbKey ? String(r.clbKey) : r.key.slice(0, 8);
        const keyTitle = 'GBIF ' + r.key + (r.clbKey ? ' / ChecklistBank ' + r.clbKey : '');
        const status = r.status === 'undecided'
            ? '<span class="muted">undecided</span>'
            : '<span class="stage stage-' + escapeHtml(r.status) + '"' +
              ' title="' + escapeHtml((r.statusFrom || '') + (r.reason ? ': ' + r.reason : '')) + '">' +
              escapeHtml(r.status) + '</span>';
        const title = r.doi
            ? '<a href="https://doi.org/' + escapeHtml(r.doi) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(r.title) + '</a>'
            : escapeHtml(r.title);
        return '<tr>' +
            '<td class="key" title="' + escapeHtml(keyTitle) + '">' + escapeHtml(key) + '</td>' +
            '<td class="title" title="' + escapeHtml(r.title) + '">' + title + '</td>' +
            '<td>' + status + '</td>' +
            '<td class="num" title="' + escapeHtml(r.lastEventAt || '') + '">' + fmtTime(r.lastEventAt) + '</td>' +
            '<td class="num">' + fmtAge(r.lastEventAt) + '</td>' +
            '<td class="num">' + fmtNum(r.nameUsagesCount) + '</td>' +
            '<td>' + escapeHtml(r.licence || '–') + '</td>' +
            '<td>' + escapeHtml(r.publishingCountry || '–') + '</td>' +
            '<td class="muted">' + escapeHtml(r.matchedBy || '–') + '</td>' +
            '<td class="num">' + gbifAction(r) + '</td>' +
            '</tr>';
    }).join('');
}

async function gbifDecide(key, action) {
    const msg = document.getElementById('gbifMsg');
    msg.textContent = action + ' ' + key.slice(0, 8) + '…';
    try {
        const resp = await fetch('/gbif/' + key + '/' + action, { method: 'POST' });
        const body = await resp.json();
        msg.textContent = resp.ok
            ? (action === 'add' ? 'queued: ' : action + ': ') + (body.output || key)
            : 'refused: ' + body.error + (body.output ? ' -- ' + body.output : '');
        loadGbifDatasets();
    } catch (e) {
        msg.textContent = 'failed: ' + e;
    }
}

function startRefresh() {
    loadQueue();
    refreshTimer = setInterval(() => {
        if (currentTab === 'pipeline') {
            loadQueue();
        }
    }, 30000);
}

startRefresh();
</script>
