name: Verify tree invariants

# The tree is the database and these are its integrity checks. `deploy.yml` is
# disabled (GitHub Pages is served from the Docker deploy on debbie instead) and
# was gated `if: false` anyway, so nothing ran on commit -- a bad import was
# caught at the *next* audit, which is how 980,786 wrong lineages survived until
# 2026-10-05.
#
# Deliberately cheap: Python only, no `npm ci`, no six-kingdom build. It reads
# ~1 GB of committed family JSON and takes about four minutes, which is the same
# work `make check` does locally.
#
# CAVEAT: this repo's GitHub Actions minutes are billing-locked, which is why
# `deploy.yml`'s push trigger is commented out. Until that is resolved this
# workflow will not run on push, and `make check` is the gate that actually
# holds. Re-enabling deploy.yml and this file are separate decisions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The traversal everything else depends on. Seconds, and it is the only
      # check that can catch `scripts/tree.py` itself being edited wrongly.
      - name: tree.py selftest
        run: python3 scripts/tree.py

      # Nine data invariants across all six kingdoms, non-zero exit on
      # violation.
      - name: verifyTree
        run: python3 scripts/verifyTree.py

      # Report-only: lists outstanding issues without rewriting the queue.
      # Not an exit-code gate, because there are ~2.3M open issues by design at
      # this point and failing on them would mean the workflow is always red.
      - name: sanity scan
        run: python3 scripts/sanity_scan.py taxonomy