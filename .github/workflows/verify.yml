name: Verify tree invariants

# The tree is the database and these are its integrity checks. `deploy.yml` is
# disabled (GitHub Pages is served from the Docker deploy on debbie instead) and
# was gated `if: false` anyway, so nothing ran on commit -- a bad import was
# caught at the *next* audit, which is how 980,786 wrong lineages survived until
# 2026-10-05.
#
# Deliberately cheap: Python only, no `npm ci`, no six-kingdom build. It reads
# ~1 GB of committed family JSON and used to take about four minutes, the same
# work `make check` does locally.
#
# 2026-10-19: timed out at the 20-minute ceiling on a single oversized push (8
# large imports batched into one commit, 4,509 files changed). The actual
# integrity work was still cheap -- species.parquet built in 79s, verifyTree
# passed in ~3min -- but `actions/checkout@v4` alone took 13m58s, because it
# defaults to a full clone and this repo's history has grown alongside the
# tree itself. Fixed with `fetch-depth: 1`: this workflow only ever needs the
# current tree, never history, so a shallow clone removes the actual
# bottleneck rather than just buying a bigger timeout to hide it. Raised
# timeout-minutes too, as a margin against sanity_scan continuing to grow with
# the tree -- not the primary fix.
#
# 2026-10-23: hit the 30-minute ceiling again (run 39992329330, cancelled at
# exactly 30m0s) -- not from checkout this time (already shallow), from the
# actual work: buildSpeciesParquet.py + verifyTree.py + sanity_scan all
# walking a tree that grew by 41,452+306,000+ species in one session (the
# pending-family watcher loop, run repeatedly once a lookup bug stopped it
# silently skipping ~24 dual-kingdom families every cycle). Same margin logic
# as 2026-10-19, same fix: raise the ceiling again rather than make the
# checks themselves artificially stop early. Revisit if this keeps
# recurring -- the real fix at that point is splitting the always-growing
# sanity_scan off the push-blocking gate, not another timeout bump.
#
# 2026-10-18: this workflow DOES run on push (confirmed via `gh run list` --
# the "billing-locked" note that used to live here was stale). What was
# actually failing every run since the parquet-freshness gate landed
# (05758eb8cb) is that `portal/data/species.parquet` is gitignored and never
# committed, so a fresh checkout has none -- and a *missing* parquet is a hard
# FAIL by design (see `check_parquet_freshness` in verifyTree.py), not a silent
# fall-back like a merely *stale* one. The `species-parquet` step below builds
# it fresh every run so the gate has something to check freshness against.
# This is step 1 of the "merge-time recheck" in the Truth Pipeline plan
# (https://claude.ai/artifact/YADGdp4vS7PNwaXvSLxn1F) -- later steps move the
# parquet/name-index rebuild to a nightly job that publishes once, so this
# per-push rebuild (~2 min) isn't duplicated on every push forever.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The traversal everything else depends on. Seconds, and it is the only
      # check that can catch `scripts/tree.py` itself being edited wrongly.
      - name: tree.py selftest
        run: python3 scripts/tree.py

      # duckdb is not a project dependency (buildSpeciesParquet.py says so
      # explicitly) -- it only needs to exist for this one step.
      - name: install duckdb
        run: pip install duckdb

      # verifyTree hard-fails on a *missing* parquet (by design -- see the
      # note above), and CI never has one since it's gitignored. Build it
      # fresh so the freshness check has something real to check.
      - name: build species.parquet
        run: python3 scripts/buildSpeciesParquet.py

      # Nine data invariants across all six kingdoms, non-zero exit on
      # violation.
      - name: verifyTree
        run: python3 scripts/verifyTree.py

      # Report-only: lists outstanding issues without rewriting the queue.
      # Not an exit-code gate, because there are ~2.3M open issues by design at
      # this point and failing on them would mean the workflow is always red.
      - name: sanity scan
        run: python3 scripts/sanity_scan.py taxonomy