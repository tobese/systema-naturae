server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No SPA path-routing here — the portal uses ?family=&node=&class=
    # query params (see useUrlState.ts), so plain static serving is enough.
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Taxonomy JSON is fetched by id/order and never mutates post-build —
    # safe to cache aggressively; a new deploy ships new file content anyway.
    # Prefixed with /systema-naturae/ to match the VITE_BASE this is built
    # with (see Dockerfile) — update both together if that ever changes.
    location /systema-naturae/data/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
